name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller>=6.0

      - name: Build executable
        run: pyinstaller hoi4_studio.spec

      - name: Package artifact
        run: Compress-Archive -Path "dist/HOI4 Modding Studio/*" -DestinationPath "HOI4-Modding-Studio-Windows.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: HOI4-Modding-Studio-Windows.zip
